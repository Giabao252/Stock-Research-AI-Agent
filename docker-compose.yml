# Local dev: backend + MCP server. Qdrant (Cloud) and Redis (Upstash) are external services.
# Frontend runs outside Docker (`cd frontend && npm run dev`) for HMR.
#
#   docker compose up --build
#
# Secrets come from backend/.env; MCP_SERVER_URL is overridden so the backend
# reaches the mcp container instead of localhost.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: backend/.env
    environment:
      MCP_SERVER_URL: http://mcp:8001/mcp/
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp:
    build: ./backend
    command: ["fastmcp", "run", "app/mcp_servers/server.py", "--transport", "http", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    env_file: backend/.env
    healthcheck:
      # Any HTTP response means the server is up; /mcp/ itself rejects a bare GET.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8001/mcp/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
